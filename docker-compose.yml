services:
  nginx:
    image: docker.io/library/nginx:1.25.3-alpine
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - humo-network
    environment:
      - NGINX_PORT=${APP_PORT}

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.dev
      args:
        USERID: ${USERID:-1000}
        GROUPID: ${GROUPID:-1000}
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage
      - ./media:/var/www/html/media
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - NGINX_PORT=${APP_PORT}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    user: "${USERID:-1000}:${GROUPID:-1000}"
    depends_on:
      - mariadb
    networks:
      - humo-network

  mariadb:
    image: docker.io/library/mariadb:11.6.2
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--password=${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - humo-network

  # Add lightweight DB management
  adminer:
    image: docker.io/library/adminer:latest
    ports:
      - "${DB_ADMIN_PORT}:8080"
    networks:
      - humo-network

networks:
  humo-network:
    driver: bridge

volumes:
  mariadb_data: