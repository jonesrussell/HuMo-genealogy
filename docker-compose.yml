name: humo-genealogy-dev

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: docker.io/library/nginx:1.25.3
    restart: unless-stopped
    init: true
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      php:
        condition: service_healthy
    networks:
      - humo-network
    environment:
      - NGINX_PORT=${APP_PORT}
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging: *default-logging

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.dev
      args:
        USERID: ${USERID:-1000}
        GROUPID: ${GROUPID:-1000}
    restart: unless-stopped
    init: true
    volumes:
      - ./:/var/www/html
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini
      - vscode-server:/home/appuser/.vscode-server
    environment:
      - NGINX_PORT=${APP_PORT}
      - MYSQL_HOST=mariadb
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - PHP_ENV=development
    user: "${USERID:-1000}:${GROUPID:-1000}"
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - humo-network
    deploy:
      resources:
        limits:
          memory: 1G
    logging: *default-logging

  mariadb:
    image: docker.io/library/mariadb:11.6.2
    restart: unless-stopped
    init: true
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MARIADB_AUTO_UPGRADE=1
      - MARIADB_DISABLE_UPGRADE_BACKUP=1
    ports:
      - "127.0.0.1:${DB_PORT}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/backup:/backup
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-u", "root", "--password=${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - humo-network
    deploy:
      resources:
        limits:
          memory: 1G
    logging: *default-logging
    shm_size: '256mb'
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    cap_add:
      - SYS_NICE

  adminer:
    image: docker.io/library/adminer:4.8.1-standalone
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${DB_ADMIN_PORT}:8080"
    networks:
      - humo-network
    environment:
      - ADMINER_DEFAULT_SERVER=mariadb
      - ADMINER_DESIGN=dracula
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "--max-time", "5", "--user-agent", "Docker-Health-Check", "http://localhost:8080" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
    depends_on:
      mariadb:
        condition: service_healthy

networks:
  humo-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
    driver_opts:
      com.docker.network.bridge.name: humo-net

volumes:
  mariadb_data:
    driver: local
  vscode-server:
    driver: local