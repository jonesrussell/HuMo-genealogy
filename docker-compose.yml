name: humo-genealogy-dev

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: docker.io/library/nginx:1.25.3-alpine
    restart: unless-stopped
    init: true
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_healthy
    networks:
      - humo-network
    environment:
      - NGINX_PORT=${APP_PORT}
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
      - /var/cache/nginx

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.dev
      args:
        USERID: ${USERID:-1000}
        GROUPID: ${GROUPID:-1000}
    restart: unless-stopped
    init: true
    volumes:
      - ./:/var/www/html:ro
      - ./storage:/var/www/html/storage
      - ./media:/var/www/html/media
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - NGINX_PORT=${APP_PORT}
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - PHP_ENV=development
    user: "${USERID:-1000}:${GROUPID:-1000}"
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - humo-network
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    shm_size: '256mb'

  mariadb:
    image: docker.io/library/mariadb:11.6.2
    restart: unless-stopped
    init: true
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MARIADB_AUTO_UPGRADE=1
      - MARIADB_DISABLE_UPGRADE_BACKUP=1
    ports:
      - "127.0.0.1:${DB_PORT}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/backup:/backup:ro
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-u", "root", "--password=${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - humo-network
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1G
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    shm_size: '256mb'
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    cap_add:
      - SYS_NICE
    tmpfs:
      - /tmp
      - /run/mysqld

  adminer:
    image: docker.io/library/adminer:4.8.1-standalone
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${DB_ADMIN_PORT}:8080"
    networks:
      - humo-network
    environment:
      - ADMINER_DEFAULT_SERVER=mariadb
      - ADMINER_DESIGN=dracula
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    depends_on:
      mariadb:
        condition: service_healthy

networks:
  humo-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
    driver_opts:
      com.docker.network.bridge.name: humo-net

volumes:
  mariadb_data:
    driver: local